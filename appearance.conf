# ===================
# APPEARANCE & WINDOW
# ===================

# macos-icon = paper
macos-icon = custom-style
macos-icon-frame = beige
macos-icon-ghost-color = #c8c093
macos-icon-screen-color = #181616,#223249

# window-decoration = none
# macos-titlebar-style = hidden
macos-titlebar-style = tabs
macos-window-buttons = hidden

background-opacity = 0.85
background-blur = 20

# Shaders
custom-shader = shaders/cursor-warp.glsl

# Padding
window-padding-x = 2
window-padding-y = 2

# Bell behavior
bell-features = no-title, attention, border
